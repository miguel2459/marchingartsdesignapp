    // Store reference to Unity instance
    let unityInstanceRef = null;

    function sendToUnity(message) {
        if (unityInstanceRef && unityInstanceRef.SendMessage) {
            unityInstanceRef.SendMessage("AppFocusManager", "OnBrowserFocusChange", message);
        }
    }

    // Focus/visibility detection
    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            console.log("👋 Tab hidden");
            sendToUnity("PAUSE");
        } else {
            console.log("👀 Tab visible");
            sendToUnity("RESUME");
        }
    });

    window.addEventListener("blur", () => {
        console.log("🔕 Window blurred");
        sendToUnity("PAUSE");
    });

    window.addEventListener("focus", () => {
        console.log("🔔 Window focused");

<script>
(function patchUnityLoaderRetry() {
    const originalFetch = window.fetch;

    window.fetch = async function(url, options) {
        // Retry only for .data file requests
        if (url.includes(".data")) {
            const maxRetries = 3;

            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    const response = await originalFetch(url, options);
                    if (!response.ok) throw new Error("Status " + response.status);
                    return response; // ✅ Success
                } catch (err) {
                    console.warn(`⚠️ .data fetch failed [${attempt}/${maxRetries}]: ${err.message}`);
                    if (attempt === maxRetries) throw err; // ❌ Give up
                    await new Promise(res => setTimeout(res, 1000 * attempt)); // ⏱️ Exponential backoff
                }
            }
        }

        // Non-.data file: default behavior
        return originalFetch(url, options);
    };
})();
</script>
<script>
    const unityCanvas = document.getElementById("unity-canvas"); // Corrected ID

    // Ensure unityCanvas exists before adding listeners to it
    if (unityCanvas) {
        // Prevent default browser gestures on the canvas itself
        // touch-action: none; in CSS should cover most of this,
        // but these act as explicit JS overrides for specific event types.
        unityCanvas.addEventListener("touchstart", function (e) {
            // Only prevent if multiple touches are involved, to allow single-tap for UI/selection
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        unityCanvas.addEventListener("touchmove", function (e) {
            // Prevent scrolling/panning by the browser
            e.preventDefault();
        }, { passive: false });

        // 'gesturestart', 'gesturechange', 'gestureend' are deprecated in favor of pointer events
        // and touch events. While they might still work on some platforms (e.g., iOS Safari),
        // touch-action: none; and preventing default on touchstart/touchmove are more standard.
        // Keeping them for now if they are explicitly causing issues, but touch-action is primary.

        // If you still want to explicitly prevent 'gesture' events, attach to document
        // as they are browser-level gestures that might not originate directly on canvas.
        document.addEventListener("gesturestart", function (e) {
            e.preventDefault();
        }, { passive: false });

        document.addEventListener("gesturechange", function (e) {
            e.preventDefault();
        }, { passive: false });

        document.addEventListener("gestureend", function (e) {
            e.preventDefault();
        }, { passive: false }); // Added passive: false
    } else {
        console.warn("Unity canvas element not found with ID 'unity-canvas'. Touch event preventDefault may not be fully effective.");
    }
</script>
<script>
    window.HideHtmlInput = function (value) {
        const inputId = window.currentInputFieldId || "default";
        document.getElementById("htmlInputContainer").style.display = "none";
        document.getElementById("unity-container").style.display = "block";
        document.getElementById("unity-canvas").style.pointerEvents = "auto";
        document.getElementById("screen-dimmer").style.display = "none";

        // IMPORTANT: remove dimmer click handler so it doesn't fire later
        const dimmer = document.getElementById("screen-dimmer");
        if (dimmer) dimmer.onclick = null;

        if (window.unityInstance) {
            console.log("[JS] Sending value to Unity:", value, "for ID:", inputId);
            window.unityInstance.SendMessage("InputBridge", "ReturnFromHtmlInput", inputId + "|" + value);
        } else {
            console.warn("[JS] Unity instance not ready!");
        }

        window.currentInputFieldId = null;
    };

    window.ShowHtmlInput = function (placeholderText = "", inputId = "default", defaultValue = "") {
        console.log("ShowHtmlInput called for ID:", inputId, "with placeholder:", placeholderText);

        const unityCanvas = document.getElementById("unity-canvas");
        const unityContainer = document.getElementById("unity-container");
        const dimmer = document.getElementById("screen-dimmer");
        const inputContainer = document.getElementById("htmlInputContainer");
        const input = document.getElementById("userInput");

        // Keep Unity visible but non-interactable
        unityCanvas.style.pointerEvents = "none";
        unityContainer.style.display = "block";

        // Show overlay (dimmer can be transparent in CSS)
        dimmer.style.display = "block";
        inputContainer.style.display = "flex";

        window.currentInputFieldId = inputId;
        window.__htmlInputClosing = false;

        input.value = defaultValue || "";  //fill with existing value
        input.placeholder = placeholderText || "Type here...";

        // --- Explicit dismiss: tap outside input ---
        dimmer.onclick = () => {
            if (window.__htmlInputClosing) return;
            window.HideHtmlInput(input.value);
        };

        // Prevent clicks inside the input container from dismissing
        inputContainer.onclick = (e) => e.stopPropagation();

        // Clear any previous handlers to avoid stacking
        input.onblur = null;
        input.onkeydown = null;

        // --- Dismiss: Enter key ---
        input.onkeydown = function (e) {
            const isEnter = (e.key === "Enter") || (e.keyCode === 13);
            if (isEnter) {
                e.preventDefault();
                if (window.__htmlInputClosing) return;
                window.HideHtmlInput(input.value);
            }
        };

        // --- Dismiss: blur (still useful on some devices) ---
        input.onblur = function () {
            if (window.__htmlInputClosing) return;
            window.HideHtmlInput(input.value);
        };

        setTimeout(() => input.focus(), 200);
    };

</script>
