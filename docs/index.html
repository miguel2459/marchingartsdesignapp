<script>
(function patchUnityLoaderRetry() {
    const originalFetch = window.fetch;

    window.fetch = async function(url, options) {
        // Retry only for .data file requests
        if (url.includes(".data")) {
            const maxRetries = 3;

            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    const response = await originalFetch(url, options);
                    if (!response.ok) throw new Error("Status " + response.status);
                    return response; // ? Success
                } catch (err) {
                    console.warn(`?? .data fetch failed [${attempt}/${maxRetries}]: ${err.message}`);
                    if (attempt === maxRetries) throw err; // ? Give up
                    await new Promise(res => setTimeout(res, 1000 * attempt)); // ?? Exponential backoff
                }
            }
        }

        // Non-.data file: default behavior
        return originalFetch(url, options);
    };
})();
</script>
<script>
    const unityCanvas = document.getElementById("unity-canvas"); // Corrected ID

    // Ensure unityCanvas exists before adding listeners to it
    if (unityCanvas) {
        // Prevent default browser gestures on the canvas itself
        // touch-action: none; in CSS should cover most of this,
        // but these act as explicit JS overrides for specific event types.
        unityCanvas.addEventListener("touchstart", function (e) {
            // Only prevent if multiple touches are involved, to allow single-tap for UI/selection
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        unityCanvas.addEventListener("touchmove", function (e) {
            // Prevent scrolling/panning by the browser
            e.preventDefault();
        }, { passive: false });

        // 'gesturestart', 'gesturechange', 'gestureend' are deprecated in favor of pointer events
        // and touch events. While they might still work on some platforms (e.g., iOS Safari),
        // touch-action: none; and preventing default on touchstart/touchmove are more standard.
        // Keeping them for now if they are explicitly causing issues, but touch-action is primary.

        // If you still want to explicitly prevent 'gesture' events, attach to document
        // as they are browser-level gestures that might not originate directly on canvas.
        document.addEventListener("gesturestart", function (e) {
            e.preventDefault();
        }, { passive: false });

        document.addEventListener("gesturechange", function (e) {
            e.preventDefault();
        }, { passive: false });

        document.addEventListener("gestureend", function (e) {
            e.preventDefault();
        }, { passive: false }); // Added passive: false
    } else {
        console.warn("Unity canvas element not found with ID 'unity-canvas'. Touch event preventDefault may not be fully effective.");
    }
</script>
