<style>
:root{
  --paper:#EEF2F5; --surface:#FFFFFF; --ink:#132139; --muted:#566275; --line:#D2D9E1;
  --turf:#2D6B40; --signal:#F2C230;
  --good:#1D7448; --bad:#B3372B; --good-bg:#E2F2E9; --bad-bg:#F8E5E2; --focus:#2F6FDB;
  --display:'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --body:'Atkinson Hyperlegible', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  box-sizing:border-box;color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1522; --surface:#162034; --ink:#E7ECF4; --muted:#9DA9BB; --line:#2B3955;
    --good:#62CC96; --bad:#F2897C; --good-bg:#15362A; --bad-bg:#3B201C; --focus:#7FB0FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1522; --surface:#162034; --ink:#E7ECF4; --muted:#9DA9BB; --line:#2B3955;
  --good:#62CC96; --bad:#F2897C; --good-bg:#15362A; --bad-bg:#3B201C; --focus:#7FB0FF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--focus)}

.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:880px;margin:0 auto;padding:12px 16px}
.brand-title{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:.01em;color:inherit;text-decoration:none}

main{max-width:880px;margin:0 auto;padding:20px 16px 40px}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.05;margin:0}
h1{font-size:clamp(2rem,7vw,3.2rem);letter-spacing:-.005em;overflow-wrap:anywhere}
h2{font-size:1.6rem;margin:30px 0 10px}
p{margin:.6em 0}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:.95rem;border-left:3px solid var(--signal);padding-left:12px;max-width:620px}

.report{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:620px;margin:18px 0}
.report h2{margin-top:0}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.sm{padding:4px 10px;font-size:.88rem}
.btn:disabled{opacity:.6;cursor:progress}

.head-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:6px;color:var(--muted);font-size:.95rem}
.head-meta .coach{color:var(--ink);font-weight:700}
.head-meta .btn{margin-left:auto}
.warn{color:var(--bad);font-size:.9rem;flex-basis:100%;margin:0}
.warn:empty{display:none}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0 0}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile .v{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1}
.tile .l{color:var(--muted);font-size:.85rem;margin-top:4px}

.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;font-size:.95rem;min-width:100%}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
table.t tr:last-child>td{border-bottom:0}
table.t th{font-family:var(--display);font-weight:600;font-size:1.02rem;background:var(--surface)}
table.t td.wrap{white-space:normal;min-width:180px}
table.t td.lv{font-family:var(--display);font-weight:700;font-size:1.08rem}
.lv.ok{color:var(--good);background:var(--good-bg)}
.lv.no{color:var(--bad);background:var(--bad-bg)}
.lv.na,.dim{color:var(--muted)}
tr.dimrow td{color:var(--muted);opacity:.65}
.who-btn{background:none;border:0;padding:0;cursor:pointer;font-weight:700;text-align:left;display:inline-flex;align-items:center;gap:6px}
.who-btn::before{content:'▸';color:var(--muted);font-size:.8em;transition:transform .15s}
.who-btn[aria-expanded="true"]::before{transform:rotate(90deg)}
tr.srow{cursor:pointer}
tr.srow:hover td{background-color:color-mix(in srgb,var(--paper) 60%,transparent)}
tr.srow:hover td.lv.ok{background:var(--good-bg)} tr.srow:hover td.lv.no{background:var(--bad-bg)}
tr.detail>td{background:var(--paper);white-space:normal}
.detail-in{position:sticky;left:10px}

.badge{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--good-bg);color:var(--good)}
.badge.no{background:var(--bad-bg);color:var(--bad)}

.acts{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.acts.inner{background:transparent;border:0;border-radius:0}
.act{padding:10px 14px;border-bottom:1px solid var(--line);display:grid;gap:2px}
.acts.inner .act{padding:6px 0}
.act:last-child{border-bottom:0}
.act-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.act-who{font-weight:700}
.act-when{color:var(--muted);font-size:.88rem;margin-left:auto}
.act-miss{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.empty{padding:14px;color:var(--muted)}
.more{margin-top:10px}

.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.06em}

.links{display:flex;flex-wrap:wrap;gap:10px 22px;margin:30px 0 0}
.foot{max-width:880px;margin:0 auto;padding:18px 16px 30px;border-top:1px solid var(--line);font-size:.9rem;color:var(--muted)}
.foot a{color:var(--muted)}
.loading{color:var(--muted);margin-top:30px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.who-btn::before{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><a class="brand-title" href="/lessons/">MPR Studios Lessons</a></div></header>
<main id="app"><p class="loading">Loading your class…</p></main>
<footer class="foot"><a href="/">MPR Studios</a> · <a href="/lessons/">Lessons</a></footer>
<script>
'use strict';
const RESULTS_URL = 'https://script.google.com/macros/s/AKfycbz615SkdpqE7nBRc185t21znFZLjKnR7_vadW_L_WEXDEohgY9ZHUJEyO7nbOvOt4swzQ/exec';
const REFRESH_MS = 2 * 60 * 1000;
const RECENT_SHOWN = 20;

const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https:\/\//i.test(String(u || '')) ? String(u) : '';

// class + key live only in the hash; they're sent to the hub and nowhere else
const hp = new URLSearchParams(location.hash.slice(1));
const CODE = (hp.get('class') || '').trim().toUpperCase();
const KEY = (hp.get('key') || '').trim();

let data = null, lastLoad = 0, loading = false, timer = null, showAllRecent = false;
const open = new Set();

function card(title, body, retry){
  app.innerHTML = '<section class="report" role="alert"><h2>' + esc(title) + '</h2><p>' + esc(body) + '</p>' +
    (retry ? '<p><button class="btn primary" data-act="retry">Retry</button></p>' : '') + '</section>';
}

async function load(){
  if (loading) return;
  loading = true;
  const btn = document.querySelector('[data-act="refresh"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Refreshing…'; }
  let d = null;
  try {
    const r = await fetch(RESULTS_URL + '?' + new URLSearchParams({action:'dashboard', class:CODE, key:KEY}),
      {cache:'no-store', credentials:'omit', referrerPolicy:'no-referrer'});
    d = await r.json();
  } catch (e) { d = null; }
  loading = false;
  if (d && d.ok) { data = d; lastLoad = Date.now(); render(); return; }
  if (d && d.error === 'not_found') { data = null; stopTimer(); return card("This coach link isn't valid anymore", "Ask MPR Studios for a new one."); }
  // keep showing the last good data if we have it
  if (data) {
    render();
    const w = document.getElementById('warn');
    if (w) w.textContent = "Couldn't refresh right now. Showing the last update.";
    return;
  }
  card("Couldn't load right now", 'Check your connection and try again in a moment.', true);
}

function fmtWhen(iso, withDate){
  const d = new Date(iso);
  if (isNaN(d)) return String(iso || '');
  const opt = withDate === false ? {hour:'numeric', minute:'2-digit'} : {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'};
  return d.toLocaleString(undefined, opt);
}

function scoreOf(cell){
  const m = /^(\d+)\s*(?:of|\/)\s*(\d+)$/.exec(String(cell).trim());
  return m ? {score:+m[1], total:+m[2]} : null;
}

function passMarkFor(level){
  const l = (data.levels || []).find(x => Number(x.n) === Number(level));
  return l ? Number(l.passMark) : NaN;
}

function levelsPassed(cell){
  return String(cell).split(',').map(s => parseInt(s, 10)).filter(n => !isNaN(n));
}

function actItem(r, showName){
  const passed = r.passed === true;
  const miss = String(r.missed || '').trim();
  return '<li class="act"><div class="act-top">' +
    (showName ? '<span class="act-who">' + esc(r.student) + '</span>' : '') +
    '<span>Level ' + esc(r.level) + ': ' + esc(r.score) + '/' + esc(r.total) + '</span>' +
    '<span class="badge ' + (passed ? 'ok">Passed' : 'no">Not yet') + '</span>' +
    '<span class="act-when">' + esc(fmtWhen(r.when)) + '</span></div>' +
    (miss ? '<div class="act-miss">Missed: ' + esc(miss) + '</div>' : '') + '</li>';
}

function render(){
  const d = data;
  const head = (d.summary && d.summary.header) || [];
  const rows = (d.summary && d.summary.rows) || [];
  const recent = Array.isArray(d.recent) ? d.recent : [];
  const roster = Array.isArray(d.roster) ? d.roster : [];
  const nLevels = (d.levels || []).length;
  const col = name => head.indexOf(name);
  const iName = col('Student'), iPassed = col('Levels passed'), iLast = col('Last active');
  const lvCols = {};
  head.forEach((h, i) => { const m = /^Level (\d+) best$/.exec(h); if (m) lvCols[i] = +m[1]; });

  const weekAgo = Date.now() - 7 * 864e5;
  const started = rows.filter(r => iLast >= 0 && r[iLast] && r[iLast] !== 'Not started').length;
  const week = recent.filter(r => { const t = new Date(r.when).getTime(); return !isNaN(t) && t >= weekAgo; }).length;
  const allPassed = nLevels ? rows.filter(r => iPassed >= 0 && levelsPassed(r[iPassed]).length >= nLevels).length : 0;

  const updated = d.generated ? fmtWhen(d.generated) : fmtWhen(new Date().toISOString());
  let h = '<h1>' + esc(d.classCode || CODE) + ' · Coach dashboard</h1>' +
    '<div class="head-meta">' + (d.coachName ? '<span class="coach">' + esc(d.coachName) + '</span>' : '') +
    '<span>Updated ' + esc(updated) + '</span>' +
    '<button class="btn sm" data-act="refresh">Refresh</button><p class="warn" id="warn" role="status"></p></div>';

  h += '<div class="tiles">' +
    [[rows.length, 'Students'], [started, 'Started'], [week, 'Checks this week'], [allPassed, 'Passed all levels']]
      .map(([v, l]) => '<div class="tile"><div class="v">' + esc(v) + '</div><div class="l">' + esc(l) + '</div></div>').join('') +
    '</div>';

  // students
  h += '<h2>Students</h2>';
  if (!rows.length) {
    h += '<div class="tw"><p class="empty">No students yet. Add names on the Roster tab of your class sheet, or ask MPR Studios to add them.</p></div>';
  } else {
    h += '<div class="tw"><table class="t"><thead><tr>' + head.map(x => '<th scope="col">' + esc(x) + '</th>').join('') + '</tr></thead><tbody>';
    rows.forEach((r, ri) => {
      const name = iName >= 0 ? String(r[iName]) : '';
      const isOpen = open.has(name);
      h += '<tr class="srow" data-name="' + esc(name) + '">' + r.map((c, i) => {
        if (i === iName) return '<td><button class="who-btn" data-act="toggle" aria-expanded="' + isOpen + '" aria-controls="det' + ri + '">' + esc(c) + '</button></td>';
        if (i in lvCols) {
          const s = scoreOf(c), pm = passMarkFor(lvCols[i]);
          const cls = !s || isNaN(pm) ? 'na' : s.score >= pm ? 'ok' : 'no';
          const sr = cls === 'ok' ? ' <span class="sr">(passing)</span>' : cls === 'no' ? ' <span class="sr">(below pass mark)</span>' : '';
          return '<td class="lv ' + cls + '">' + esc(c) + sr + '</td>';
        }
        const muted = c === 'Not started' || c === 'None yet' || c === '–' || c === '';
        const wrap = /Weakest/.test(head[i] || '') ? ' wrap' : '';
        return '<td class="' + (muted ? 'dim' : '') + wrap + '">' + esc(c) + '</td>';
      }).join('') + '</tr>';
      if (isOpen) {
        const mine = recent.filter(x => String(x.student) === name);
        h += '<tr class="detail" id="det' + ri + '"><td colspan="' + head.length + '"><div class="detail-in">' +
          (mine.length ? '<ul class="acts inner">' + mine.map(x => actItem(x, false)).join('') + '</ul>'
                       : '<p class="muted" style="margin:4px 0">No recent checks.</p>') + '</div></td></tr>';
      }
    });
    h += '</tbody></table></div>';
  }

  // recent activity
  h += '<h2>Recent activity</h2>';
  if (!recent.length) h += '<div class="acts"><p class="empty">No practice checks yet.</p></div>';
  else {
    const shown = showAllRecent ? recent : recent.slice(0, RECENT_SHOWN);
    h += '<ul class="acts">' + shown.map(x => actItem(x, true)).join('') + '</ul>';
    if (recent.length > shown.length) h += '<p class="more"><button class="btn sm" data-act="more">Show all ' + recent.length + '</button></p>';
  }

  // join links
  h += '<h2>Join links</h2><p class="note">Each student gets their own link. Send it privately.</p>';
  if (!roster.length) h += '<div class="tw"><p class="empty">No students on the roster yet.</p></div>';
  else {
    h += '<div class="tw"><table class="t"><thead><tr><th scope="col">Student</th><th scope="col">Join code</th><th scope="col">Link</th></tr></thead><tbody>' +
      roster.map((s, i) => {
        const link = safeUrl(s.link);
        return '<tr' + (s.active ? '' : ' class="dimrow"') + '><td>' + esc(s.name) + (s.active ? '' : ' <span class="muted">(inactive)</span>') + '</td>' +
          '<td class="code">' + (s.code ? esc(s.code) : '<span class="muted">pending</span>') + '</td>' +
          '<td>' + (link ? '<button class="btn sm" data-act="copy" data-i="' + i + '">Copy link</button>' : '<span class="muted">Not ready yet</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  // footer links
  const lesson = safeUrl(d.lessonUrl), sheet = safeUrl(d.sheetUrl);
  h += '<div class="links">' +
    (lesson ? '<a href="' + esc(lesson + '#coachclass=' + encodeURIComponent(CODE) + '&coachkey=' + encodeURIComponent(KEY)) + '">Open the lesson (coach preview)</a>' : '') +
    (sheet ? '<a href="' + esc(sheet) + '" target="_blank" rel="noopener noreferrer">Open your Google Sheet</a>' : '') + '</div>';

  app.innerHTML = h;
  fitDetails();
}

// keep an expanded row's checks inside the visible part of the scrolling table
function fitDetails(){
  app.querySelectorAll('.detail-in').forEach(el => { el.style.width = (el.closest('.tw').clientWidth - 20) + 'px'; });
}
window.addEventListener('resize', fitDetails);

async function copyText(text){
  // some browsers leave writeText pending (permission prompt); fall back rather than hang
  try {
    const ok = await Promise.race([navigator.clipboard.writeText(text).then(() => true),
      new Promise(r => setTimeout(() => r(false), 1500))]);
    if (ok) return true;
  } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return ok;
}

app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  const row = e.target.closest('tr.srow');
  const act = b ? b.dataset.act : row ? 'toggle' : '';
  if (act === 'retry') { app.innerHTML = '<p class="loading">Loading your class…</p>'; load(); }
  else if (act === 'refresh') load();
  else if (act === 'more') { showAllRecent = true; render(); }
  else if (act === 'toggle' && row) {
    const name = row.dataset.name;
    open.has(name) ? open.delete(name) : open.add(name);
    render();
    const again = app.querySelector('tr.srow[data-name="' + CSS.escape(name) + '"] .who-btn');
    if (again) again.focus();
  } else if (act === 'copy') {
    const s = data && data.roster[+b.dataset.i];
    if (!s) return;
    const ok = await copyText(s.link);
    b.textContent = ok ? 'Copied' : 'Copy failed';
    setTimeout(() => { if (b.isConnected) b.textContent = 'Copy link'; }, 2000);
  }
});

function stopTimer(){ if (timer) { clearInterval(timer); timer = null; } }
function startTimer(){
  stopTimer();
  timer = setInterval(() => { if (!document.hidden && data) load(); }, REFRESH_MS);
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && data && Date.now() - lastLoad >= REFRESH_MS) load();
});

window.addEventListener('hashchange', () => location.reload());

if (!CODE || !KEY) {
  card('Coach link needed', 'This page needs your private coach link. Find it in your welcome email or on the Start here tab of your class sheet.');
} else {
  load();
  startTimer();
}
</script>
</body>
</html>
