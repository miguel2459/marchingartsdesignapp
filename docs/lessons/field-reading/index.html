<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Reading &amp; Step Size</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2F5; --surface:#FFFFFF; --ink:#132139; --muted:#566275; --line:#D2D9E1;
  --turf:#2D6B40; --turf-2:#29633B; --apron:#1D3828; --signal:#F2C230;
  --good:#1D7448; --bad:#B3372B; --good-bg:#E2F2E9; --bad-bg:#F8E5E2; --focus:#2F6FDB;
  --start-ink:#1A73B0; --end-ink:#7A3FC4; /* field's #6EC8FF / #C77DFF, deepened for text on light paper */
  --display:'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --body:'Atkinson Hyperlegible', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1522; --surface:#162034; --ink:#E7ECF4; --muted:#9DA9BB; --line:#2B3955;
    --good:#62CC96; --bad:#F2897C; --good-bg:#15362A; --bad-bg:#3B201C; --focus:#7FB0FF;
    --start-ink:#6EC8FF; --end-ink:#C77DFF;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1522; --surface:#162034; --ink:#E7ECF4; --muted:#9DA9BB; --line:#2B3955;
  --good:#62CC96; --bad:#F2897C; --good-bg:#15362A; --bad-bg:#3B201C; --focus:#7FB0FF;
  --start-ink:#6EC8FF; --end-ink:#C77DFF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
img,svg{max-width:100%}

/* header + level track */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:880px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand-title{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:.01em;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.who{color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.trk{background:none;border:0;border-bottom:3px solid transparent;padding:4px 2px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.trk-n{font-family:var(--display);font-weight:700;font-size:1.05rem;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);line-height:1}
.trk-t{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.trk.passed .trk-n{background:var(--turf);border-color:var(--turf);color:#fff}
.trk.cur{border-bottom-color:var(--signal)}
.trk.cur .trk-t{color:var(--ink)}
.trk:disabled{opacity:.4;cursor:not-allowed}
@media (max-width:600px){.trk-t{display:none}}

main{max-width:880px;margin:0 auto;padding:20px 16px 40px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.05;margin:0}
h1{font-size:clamp(2.3rem,7vw,3.6rem);letter-spacing:-.005em}
h2{font-size:1.9rem}
h3{font-size:1.4rem;font-weight:600;margin-top:1.6em;margin-bottom:.35em}
p{margin:.6em 0}
.prose{max-width:66ch}
.prose ul{padding-left:1.2em;margin:.4em 0}
.prose li{margin:.3em 0}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:.95rem;border-left:3px solid var(--signal);padding-left:12px}

/* hero */
.hero-fig{margin:0 0 18px}
.hero .lede{font-size:1.1rem;max-width:58ch}
.levels-list{list-style:none;padding:0;margin:18px 0;display:grid;gap:6px;max-width:58ch}
.levels-list li{display:grid;grid-template-columns:34px 1fr;align-items:baseline;gap:8px}
.levels-list .n{font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--turf)}
:root:not([data-theme="light"]) .levels-list .n{color:inherit}
.name-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:14px}
.name-row p{flex-basis:100%;margin:0}

/* buttons */
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.9rem}

/* level */
.lvl-head .num{color:var(--muted);font-size:.95rem;margin:0 0 4px}
.lvl-head .sub{color:var(--muted);margin:.3em 0 0;font-size:1.05rem}
.tabs{display:flex;gap:4px;margin:18px 0 14px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;font-weight:700;color:var(--muted);margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}

.fig{margin:16px 0;max-width:620px}
.fig figcaption{font-size:.95rem;color:var(--muted);margin-top:6px}
table.t{border-collapse:collapse;margin:10px 0;font-size:.95rem;min-width:100%}
.tw{overflow-x:auto;max-width:620px}
table.t th,table.t td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th{font-family:var(--display);font-weight:600;font-size:1.05rem}
table.t td.c{font-family:var(--display);font-weight:700;font-size:1.1rem}

/* field svg */
svg.field{display:block;width:100%;height:auto;border-radius:6px}
.field .g1{stroke:#fff;stroke-opacity:.09;stroke-width:.06}
.field .g4{stroke:#fff;stroke-opacity:.2;stroke-width:.08}
.field .yl{stroke:#fff;stroke-width:.32}
.field .yl.goal{stroke-width:.6}
.field .sideline{stroke:#fff;stroke-width:.6}
.field .ticks line{stroke:#fff;stroke-width:.2}
.field .hashline{stroke:#fff;stroke-opacity:.22;stroke-width:.1;stroke-dasharray:.6 .6}
.field .yl-label{fill:#fff;font-family:var(--display);font-weight:700;font-size:2.3px;text-anchor:middle}
.field .yl-label .sd{font-size:1.4px;fill-opacity:.75}
.field .ref-label{fill:#fff;fill-opacity:.85;font-family:var(--body);font-size:1.5px}
.field .path{fill:none;stroke:var(--signal);stroke-width:.45;stroke-linejoin:round;stroke-linecap:round}
.field .path.ghost{stroke-opacity:.55;stroke-dasharray:1 .7}
.field .leg{stroke:#fff;stroke-width:.25;stroke-dasharray:.8 .5}
.field .leg-label{fill:#fff;font-family:var(--body);font-weight:700;font-size:1.6px;paint-order:stroke;stroke:#14301F;stroke-width:.4}
.field .dot{--dc:#6EC8FF}
.field .dot.end{--dc:#C77DFF}
.field .dot.opt{--dc:#fff}
.field .dot.cp,.field .dot.reveal{--dc:var(--signal)}
.field .dot.opt.right{--dc:#62D99A}
.field .dot.opt.dim{opacity:.4}
.field .dot .xo{fill:none;stroke:#0B1526;stroke-width:.46;stroke-linecap:round}
.field .dot .xc{fill:none;stroke:var(--dc);stroke-width:.22;stroke-linecap:round}
.field .dot.start .dot-label,.field .dot.end .dot-label,.field .dot.opt .dot-label{fill:var(--dc)}
.field .dot-label{fill:#fff;font-family:var(--display);font-weight:700;font-size:2px;paint-order:stroke;stroke:#132139;stroke-width:.4}
.field .dot-label.opt{font-size:2.4px}
.field .marcher .mo{fill:none;stroke:#0B1526;stroke-width:.4}
.field .marcher .mr{fill:none;stroke:var(--signal);stroke-width:.2}
.field .marcher .mc{fill:var(--signal);stroke:#0B1526;stroke-width:.08}
.field .dot.opt.wrong{--dc:#FF3B3B}

/* practice */
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:.95rem;margin-bottom:8px}
.qbar{height:4px;background:var(--line);border-radius:2px;margin-bottom:16px;overflow:hidden}
.qbar span{display:block;height:100%;background:var(--turf)}
.prompt{font-size:1.15rem;max-width:62ch;margin:0 0 6px}
.givens{list-style:disc;margin:0 0 10px;padding-left:1.25em;max-width:62ch;font-size:1.05rem;line-height:1.45}
.givens li{margin:2px 0;overflow-wrap:anywhere}
.givens li::marker{color:var(--muted)}
.givens .gl{font-weight:700}
.givens .gl.start{color:var(--start-ink)}
.givens .gl.end{color:var(--end-ink)}
.prompt.ask{font-weight:700;border-left:3px solid var(--signal);padding:2px 0 2px 10px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:10px 0;max-width:620px;font-size:.95rem}
.fcard p{margin:2px 0;padding:2px 8px;border-left:3px solid transparent}
.fcard.hl p{color:var(--muted)}
.fcard.hl p.on{color:var(--ink);font-weight:700;border-left-color:var(--signal)}
.opts{display:grid;gap:8px;margin:14px 0;max-width:620px}
.opts.pick{grid-template-columns:repeat(4,1fr)}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;line-height:1.35}
.opts.pick .opt{text-align:center;font-family:var(--display);font-weight:700;font-size:1.5rem;padding:8px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.fb{border-left:4px solid var(--good);background:var(--surface);padding:10px 14px;border-radius:0 8px 8px 0;max-width:620px}
.fb.no{border-left-color:var(--bad)}
.fb-h{font-weight:700;margin:0 0 2px}
.fb.ok .fb-h{color:var(--good)} .fb.no .fb-h{color:var(--bad)}
.score{display:flex;align-items:baseline;gap:8px;margin:10px 0}
.score .big{font-family:var(--display);font-weight:700;font-size:5rem;line-height:1}
.score .of{font-family:var(--display);font-size:2rem;color:var(--muted)}

/* player */
.player{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:16px 0;max-width:660px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:10px}
.seg button{background:none;border:0;padding:7px 14px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.custom{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 10px;font-size:.95rem}
.custom label{display:flex;flex-direction:column;gap:2px}
.custom select{border:1.5px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px}
.pctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.pctl .btn{padding:8px 12px}
.tempo{display:flex;align-items:center;gap:8px;font-size:.95rem;margin-left:auto}
.readout{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;margin-top:12px}
.count{font-family:var(--display);font-weight:700;font-size:3.6rem;line-height:.9;min-width:2.2ch;text-align:right;grid-row:span 2}
.count-l{font-size:.85rem;color:var(--muted)}
.ppos{font-weight:700}
.pstats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:.95rem;color:var(--muted)}
.pstats b{color:var(--ink)}
.cpread{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:10px 0 0}
.player .fig{margin:0 0 6px}
table.t tr.on td{background:rgba(242,194,48,.28)}
.field .dot.on .xc{stroke:#fff;stroke-width:.36}
.field .dot.on .dot-label{font-size:2.6px}

.report{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:620px}
.foot{max-width:880px;margin:0 auto;padding:18px 16px 30px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;font-size:.9rem;color:var(--muted)}
.foot label{display:flex;align-items:center;gap:6px}
.foot select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px}
.coach-note{max-width:880px;margin:10px auto 0;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--signal);border-radius:8px}
.coach-note[hidden]{display:none}
.brand-r{display:flex;align-items:baseline;gap:10px;min-width:0}
.cls-chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 10px;font-size:.8rem;cursor:pointer;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
.cls-panel{position:absolute;top:100%;right:max(16px,calc((100% - 880px) / 2 + 16px));z-index:6;width:min(360px,calc(100vw - 32px));padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;box-shadow:0 8px 20px rgba(0,0,0,.18);font-size:.95rem}
@media (max-width:520px){.cls-panel{left:16px;right:16px;width:auto}}
.cls-panel[hidden]{display:none}
.cls-form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.cls-form label{display:flex;flex-direction:column;gap:2px;font-size:.85rem;color:var(--muted)}
.cls-form input{border:1.5px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 9px;text-transform:uppercase;width:10ch}
.cls-form .btn{padding:7px 14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:20;max-width:calc(100vw - 32px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:.95rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
@media (max-width:520px){.tempo{margin-left:0}.opts.pick .opt{font-size:1.3rem}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><button class="brand-title" data-act="home">Field Reading &amp; Step Size</button><span class="brand-r"><span class="who" id="who"></span><button class="cls-chip" id="clsChip" data-act="clsopen" aria-expanded="false" aria-controls="clsPanel">Join a class</button></span></div>
  <nav class="track" id="track" aria-label="Levels"></nav>
</div>
<div class="cls-panel" id="clsPanel" hidden></div>
</header>
<div class="coach-note" id="coachNote" role="status" hidden><span>Coach mode: all levels unlocked</span><button class="linkbtn" data-act="coachx" aria-label="Dismiss">✕</button></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<main id="app"></main>
<footer class="foot">
  <label>Field <select id="hashSel"><option value="college">College hashes (32 steps)</option><option value="hs">High school hashes (28 steps)</option></select></label>
  <button class="linkbtn" data-act="reset" id="resetBtn">Reset progress</button>
</footer>
<script>
'use strict';
const DEPTH=85.33, QN=8, PASS=6, KEY='cb-lesson-v1';
const ACTIVE_LEVELS = 4; // levels past this are hidden (code kept)
const RESULTS_URL = 'https://script.google.com/macros/s/AKfycbz615SkdpqE7nBRc185t21znFZLjKnR7_vadW_L_WEXDEohgY9ZHUJEyO7nbOvOt4swzQ/exec';
const LESSON_ID = 'field-reading'; const APP_VERSION = '1.0';
const CLASS_KEY = 'mpr-class-v1'; // {classCode, studentId, name, joinedAt, attempts, lastSent}; progress in KEY is tied to the student via S.owner
const qnFor=n=>n===2||n===3?10:QN;
const passFor=n=>n===2||n===3?8:PASS;
const S={name:'',hash:'college',grid:true,best:{},unlocked:1,owner:''}; // owner: studentId the progress belongs to ('' = solo)
function load(){try{const r=localStorage.getItem(KEY);if(r)Object.assign(S,JSON.parse(r));}catch(e){}
  if(S.best[2]!==undefined&&S.l2v!==2){delete S.best[2];S.l2v=2;save();}
  if(S.best[3]!==undefined&&S.l3v!==3){delete S.best[3];S.l3v=3;save();}
  if(S.unlocked>calcUnlocked()){S.unlocked=calcUnlocked();save();}} // also undoes old saved coach unlocks
// 1 + consecutive passed levels from Level 1, capped at ACTIVE_LEVELS.
function calcUnlocked(){let u=1;while(u<ACTIVE_LEVELS&&(S.best[u]||0)>=passFor(u))u++;return u;}
let COACH=false; // ?coach= unlock; session only, never saved
let PREVIEW=false; // #coachclass=&coachkey= coach preview: COACH plus no class join, no results, nothing saved
const levelOpen=n=>n<=ACTIVE_LEVELS&&(n<=S.unlocked||COACH);
function save(){if(PREVIEW)return;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const H=()=>S.hash==='hs'?28:32;
const hashName=()=>S.hash==='hs'?'a high school field':'a college field';
const reduced=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const uniq=a=>[...new Set(a)];
const round2=v=>Math.round(v*100)/100;
const fmt=v=>String(round2(v));
const fmtIn=(v,d=1)=>{const m=Math.pow(10,d);return String(Math.round(v*m)/m)+'"';};
const steps=n=>round2(n)===1?'1 step':fmt(n)+' steps';
const FR={0:'0',0.25:'¼',0.5:'½',0.75:'¾',1:'1',1.25:'1¼',1.5:'1½',1.75:'1¾',2:'2',2.5:'2½',3:'3'};
const fmtFrac=v=>{const r=round2(v);return FR[r]!==undefined?FR[r]:fmt(r);};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtSS=n=>{const s=Math.round(n*10)/10;return (s===Math.floor(s)?String(Math.floor(s)):String(s))+'-to-5';};
const fmtSPC=v=>{let s=String(Math.round(v*100)/100);if(s.includes('.'))s=s.replace(/\.?0+$/,'');return s;};
const CLEAN_SS=[6,8,12,16];
const ssNearest=n=>CLEAN_SS.reduce((a,b)=>Math.abs(b-n)<Math.abs(a-n)?b:a);
const ssLean=n=>{const near=ssNearest(n),art=near===8?'an':'a';if(Math.abs(n-near)<=0.2)return `about ${art} ${near}-to-5`;return `a little ${n>near?'smaller':'bigger'} than ${art} ${near}-to-5`;};
const gutSentence=(st,co)=>st===co?'Same counts as steps: exactly an 8-to-5.':co>st?'More counts than steps, so smaller than an 8-to-5.':'Fewer counts than steps, so bigger than an 8-to-5.';
const gcd=(a,b)=>b?gcd(b,a%b):a;
const fracStr=(a,b)=>{const g=gcd(a,b);return `${a/g}/${b/g}`;};

/* ---------- coordinates ---------- */
function lineName(k){if(k<=0)return 'S1 goal line';if(k>=20)return 'S2 goal line';if(k===10)return '50';return k<10?`S1 ${5*k}`:`S2 ${5*(20-k)}`;}
function the(k){return 'the '+lineName(k);}
function latParts(x){x=round2(x);let k=Math.round(x/8);const fr=x/8-Math.floor(x/8);if(Math.abs(fr-0.5)<1e-9){k=x<80?Math.floor(x/8):Math.ceil(x/8);}const off=round2(x-8*k);let inside=null;if(k<10)inside=off>0;else if(k>10)inside=off<0;return {k,off,inside};}
function latDesc(x){const {k,off,inside}=latParts(x);if(off===0)return 'On '+the(k);const n=Math.abs(off);if(k===10)return `${steps(n)} to the Side ${off<0?1:2} side of the 50`;return `${steps(n)} ${inside?'inside':'outside'} ${the(k)}`;}
function depDesc(y){const h=H();y=round2(y);if(y<h/2)return y===0?'on the front sideline':`${steps(y)} off the front sideline`;const off=round2(y-h);if(off===0)return 'on the front hash';return `${steps(Math.abs(off))} ${off>0?'behind':'in front of'} the front hash`;}
function posDesc(p){return latDesc(p.x)+', '+depDesc(p.y);}
function explainLat(x){const {k,off,inside}=latParts(x);if(off===0)return `Laterally, it's right on ${the(k)}.`;const n=Math.abs(off);if(k===10)return `Laterally, it's ${steps(n)} off the 50 toward Side ${off<0?1:2}.`;return `Laterally, the closest yard line is ${the(k)}, and the dot is ${steps(n)} from it toward ${inside?"the 50, so it's <b>inside</b>":"the goal line, so it's <b>outside</b>"}.`;}

function cbExplain(v,X,p){const L=v.leg;const cyc=Math.floor(X/(2*L));const r=X-cyc*2*L;const cy=cyc?` of cycle ${cyc+1}`:'';let d;

function learn1(){const h=H();const p={x:8*6+3,y:h+4};return `<div class="prose">
<p>Every spot on the field has two parts: where you are <b>side to side</b> (lateral) and where you are <b>front to back</b> (depth). Say lateral first, then depth, every time. If you can't name your spot instantly, nothing else in this lesson will hold up.</p>
<h3>Lateral: yard lines</h3>
<p>Yard lines are 5 yards apart, which is <b>8 steps</b> at an 8-to-5. Name the closest yard line, then how many steps you are from it.</p>
<ul><li><b>Inside</b> means toward the 50. <b>Outside</b> means toward the goal line.</li>
<li>Side 1 is on the left of a drill chart (the audience's left).</li>
<li>Halfway between lines is 4 steps. "4 inside the 30" and "4 outside the 35" are the same spot.</li></ul>

<ul><li><b>In front of</b> the hash means toward the audience. <b>Behind</b> means toward the back sideline.</li>

${fig({pts:[{...p,r:1.1}],minW:40},`This dot: <b>${posDesc(p)}</b>.`)}
<p class="note">A real field has no step grid. The grid is here to train your eye; on the real field you'll count from the yard lines and hashes instead.</p>`;}
function learn2(){const h=H();
  const f1a={x:48,y:h},f1b={x:64,y:h};

  const f3a={x:52,y:h},f3b={x:60,y:h};
  const f4a={x:75,y:h},f4b={x:86,y:h};
  const f5a={x:34,y:h},f5b={x:50,y:h};
  return `<div class="prose">
<h3>The one question</h3>
<p>Here's the secret: every step size question you'll ever get is really just one question.</p>
<p><b>How many 8-to-5 steps to my dot, and how many counts do I have to get there?</b></p>
<p>Answer those two numbers and the rest is easy math. Seriously. Let's get really good at both.</p>
<h3>Your ruler</h3>
<p>The 8-to-5 step is your ruler. Yard lines are always 8 of them apart, so the whole field is one giant ruler with a mark every 8 steps.</p>
<p>To count the steps between two dots, walk it in pieces: from your dot to the nearest yard line, then line to line in 8s, then from the last line to your end dot. Add up the pieces.</p>
<p><b>Line to line.</b> S1 30 to S1 40. Two gaps: 8 + 8 = <b>16 steps</b>. Easy.</p></div>
${fig({pts:[{...f1a,label:'Start'},{...f1b,cls:'end',label:'End'}],paths:[{pts:[f1a,f1b]}],ruler:{x1:48,x2:64,y:h}},'S1 30 → S1 40')}
<div class="prose"><p><b>Off a line.</b> 2 outside the S1 30 to the S1 40. You start 2 steps before the 30, so: 2 + 8 + 8 = <b>18 steps</b>.</p></div>
${fig({pts:[{...f2a,label:'Start'},{...f2b,cls:'end',label:'End'}],paths:[{pts:[f2a,f2b]}],ruler:{x1:46,x2:64,y:h}},'2 outside S1 30 → S1 40')}
<div class="prose"><p><b>Same line, opposite sides.</b> 4 outside the S1 35 to 4 inside the S1 35. This one fools people, because both dots "say" 35. But you're crossing the line: 4 + 4 = <b>8 steps</b>.</p></div>
${fig({pts:[{...f3a,label:'Start'},{...f3b,cls:'end',label:'End'}],paths:[{pts:[f3a,f3b]}],ruler:{x1:52,x2:60,y:h}},'4 outside S1 35 → 4 inside S1 35')}
<div class="prose"><p><b>Crossing the 50.</b> 3 inside the S1 45 to 2 inside the S2 45. After the 50, the yard numbers count back down, so use the 50 as your anchor. 3 inside the S1 45 is 5 steps from the 50. 2 inside the S2 45 is 6 steps past it. 5 + 6 = <b>11 steps</b>.</p></div>
${fig({pts:[{...f4a,label:'Start'},{...f4b,cls:'end',label:'End'}],paths:[{pts:[f4a,f4b]}],ruler:{x1:75,x2:86,y:h}},'3 inside S1 45 → 2 inside S2 45')}
<div class="prose"><p class="note">Tip: say your pieces out loud. "Two, plus eight, plus eight, is eighteen." Doing this in your head on the field is a skill every tech notices.</p>
<h3>The gut check</h3>
<p>Before you touch the formula, compare your two numbers. An 8-to-5 is the step where one count covers exactly one ruler step. So:</p>
<ul><li><b>Same counts as steps:</b> it's an 8-to-5.</li>
<li><b>More counts than steps:</b> you've got extra time, so your steps get <b>smaller</b>.</li>
<li><b>Fewer counts than steps:</b> you're short on time, so your steps get <b>bigger</b>.</li></ul>
<p>This takes two seconds, and it catches almost every math mistake. If your answer and your gut check ever disagree, trust your gut and redo the math.</p>
<h3>The formula</h3>
<p><b>Step Size = Ruler (8) × Time (counts) ÷ Distance (steps)</b></p>
<p>Ruler is always 8, because there are 8 of these steps between yard lines. Time is your counts. Distance is how many 8-to-5 steps to your dot.</p>
<p>Why the 8? A step size tells you how many of <i>your</i> steps fit in 5 yards, and 5 yards is 8 ruler steps.</p>
<p>Let's try one together: <b>10 steps to your dot in 12 counts.</b><br>
Gut check first: more counts than steps, so it should be smaller than an 8-to-5.<br>
Now the math: 8 × 12 ÷ 10 = <b>9.6</b>. A 9.6-to-5. Smaller than an 8-to-5, just like your gut said.</p>
<h3>Real drill isn't always clean</h3>
<p>Drill writers don't always hand you a perfect 6 or 8. You'll see a 9.6, a 7.1, a 6.1. That's completely normal. Here's how to read them.</p></div>
<div class="tw"><table class="t"><thead><tr><th>Step size</th><th>Each step</th></tr></thead><tbody>
<tr><td class="c">6-to-5</td><td>30"</td></tr>
<tr><td class="c">8-to-5</td><td>22.5"</td></tr>
<tr><td class="c">12-to-5</td><td>15"</td></tr>
<tr><td class="c">16-to-5</td><td>11.25"</td></tr>
</tbody></table></div>
<div class="prose"><p>The one rule to remember: <b>bigger number, smaller step.</b> A 12-to-5 is smaller than a 6-to-5, because you're taking 12 steps to cover the same 5 yards.</p>
<p>So a 9.6 sits between an 8 and a 12, closer to the 8: a little smaller than an 8-to-5. A 6.1 is basically a 6-to-5. Name the closest one, then say which way it leans.</p>
<h3>Flip it around</h3>
<p>Same formula, different questions.</p>
<p><b>How many counts do I need?</b> Counts = Step Size × Distance ÷ 8<br>
12 steps at an 8-to-5: 8 × 12 ÷ 8 = <b>12 counts</b>.</p>
<p><b>Where do I land?</b> Distance = 8 × Counts ÷ Step Size<br>
Start 2 inside the S1 20 and do a 6-to-5 for 12 counts: 8 × 12 ÷ 6 = 16 steps. You land <b>2 inside the S1 30</b>.</p></div>
${fig({pts:[{...f5a,label:'Start'},{...f5b,cls:'end',label:'End'}],paths:[{pts:[f5a,f5b]}],ruler:{x1:34,x2:50,y:h}},'2 inside S1 20 → 2 inside S1 30 (16 steps)')}
<div class="prose">
<h3>In inches</h3>
<p>Some people feel it better in inches: <b>Inches = 22.5 × Steps ÷ Counts.</b><br>
10 steps in 12 counts: 22.5 × 10 ÷ 12 = <b>18.75"</b>. Put that next to 22.5" for an 8-to-5 and you can feel exactly how much to shorten up.</p>
<h3>Coming up next</h3>
<p>Everything so far has been straight side to side. In Level 3 we go diagonal. You'll use this exact formula; the only new trick is finding the Distance when your path isn't straight.</p>
<h3>Try it yourself</h3>
<p>Pick a start, an end, and your counts. Make your guess before you hit "Show me."</p></div>
<div class="player" id="calc">${calcInner()}</div>`;}
function learn3(){const h=H();
  const a={x:56,y:h-4},b={x:72,y:h+4};
  const p6a={x:40,y:h-4},p6b={x:46,y:h+4};
  const triFig=(s,e,show,cap)=>fig({pts:[{...s,label:'Start',lx:-5.6,ly:-0.7},{...e,cls:'end',label:'End'}],triangle:{x1:s.x,y1:s.y,x2:e.x,y2:e.y,showA:true,showB:true,showC:show}},cap);
  return `<div class="prose">
<h3>Now let's go diagonal</h3>
<p>In Level 2 you learned the formula: <b>Step Size = Ruler (8) × Time (counts) ÷ Distance (steps)</b>. That works great when you're moving straight side to side, because you can count the Distance right off the yard lines.</p>
<p>But a lot of drill isn't straight. When your path goes over <i>and</i> forward or back at the same time, it's a diagonal, and you can't count a diagonal off the yard lines. So we need one extra step to find the Distance. Good news: it's math you already know.</p>
<h3>Every diagonal is a triangle</h3>
<p>Look at any diagonal move and you'll see a right triangle hiding in it.</p>
<ul><li><b>A</b> is how far you go <b>over</b> (side to side).</li>
<li><b>B</b> is how far you go <b>forward or back</b>.</li>
<li><b>C</b> is the diagonal, <b>the path you actually march</b>.</li></ul></div>
${triFig(a,b,false,'S1 35, 4 in front of the front hash → S1 45, 4 behind the front hash')}
<div class="prose"><h3>Find A and B</h3>
<p>You already have both skills.</p>
<p><b>A</b> is your Level 2 ruler. Count the 8-to-5 steps side to side, the same way: from your dot to the line, line to line in 8s, line to your end dot.</p>
<p><b>B</b> is your Level 1 depth reading. How many steps forward or back? Use the hash: "4 in front" to "4 behind" is 8 steps.</p>
<p>In our example: A = 16, B = 8.</p>
<h3>Solve for C</h3>
<p>This is the Pythagorean theorem: <b>A² + B² = C²</b>, so <b>C = √(A² + B²)</b>.</p>
<p>Get your phone calculator out. Seriously, everybody on the field has one.</p>
<p>16² + 8² = 256 + 64 = 320. √320 = <b>17.9 steps</b>.</p>
<p>That 17.9 is your Distance, in 8-to-5 steps.</p>
<p><b>Gut check C:</b> C is always longer than the longer leg and shorter than A + B. Here that means somewhere between 16 and 24. 17.9 fits. If your C ever lands outside that range, redo the math.</p>
<h3>Plug C into the step size formula</h3>
<p>Now it's just Level 2.</p>
<p><b>Step Size = Ruler (8) × Time (counts) ÷ Distance (C)</b></p>
<p>Say that move is 16 counts. <b>Gut check first:</b> 16 counts, fewer than 17.9 steps, so it's bigger than an 8-to-5.<br>
<b>Calculate:</b> 8 × 16 ÷ 17.9 = <b>7.2-to-5</b>. A little bigger than an 8-to-5, just like your gut said.</p>
<p>Remember the flip: <b>bigger than 8 means a smaller step. Smaller than 8 means a bigger step.</b> 7.2 is smaller than 8, so it's a bigger step.</p>
<h3>The whole thing in one line</h3>
<p><b>Find A and B → solve for C → Ruler × Time ÷ C.</b></p>
<p>That's diagonal step size. Every time.</p>
<h3>A perfect 8-to-5 on a diagonal</h3>
<p>Here's a fun one. Go <b>6 over and 8 back in 10 counts.</b></p>
<p>C = √(6² + 8²) = √100 = exactly <b>10 steps</b>.<br>
Step size = 8 × 10 ÷ 10 = <b>8-to-5</b>.</p>
<p>A diagonal that's a perfect 8-to-5. Counts equal the steps, so it passes the gut check too. Some triangles come out clean like this (6, 8, 10 is the famous one), but most don't. That's what the calculator is for.</p></div>
${triFig(p6a,p6b,true,'6 over, 8 back, C = 10')}
<div class="prose"><h3>Try it yourself</h3>
<p>Pick a start, an end, and your counts. Work it out on your phone first, then hit "Show me."</p></div>
<div class="player" id="calc3">${calc3Inner()}</div>`;}

<div class="prose">

<h3>Flip it: when do I cross a yard line?</h3>

<p><b>Count = total counts × (steps to the line ÷ total lateral steps)</b></p>
<p>Say you go <b>12 steps over in 16 counts</b>, and the yard line is <b>6 steps</b> from your start. 6 ÷ 12 = ½ of the move, and ½ × 16 = <b>count 8</b>. You should be right on the line on count 8.</p></div>

<div class="fcard" aria-label="Formula reference"><p><b>Checkpoint = Start + (count ÷ total counts) × Move</b></p><p>Do it once for lateral (A) and once for depth (B).</p></div>
<div class="prose">

/* ---------- diagonal calculator (Level 3) ---------- */
const calc3={sk:7,soff:0,sdir:1,sdep:-4,ek:9,eoff:0,edir:1,edep:4,counts:16,shown:false};
function calc3Refresh(){const el=document.getElementById('calc3');if(el)el.innerHTML=calc3Inner();}
function calc3Inner(){
  const h=H();const x1=calcX(calc3.sk,calc3.soff,calc3.sdir),x2=calcX(calc3.ek,calc3.eoff,calc3.edir);
  const y1=h+calc3.sdep,y2=h+calc3.edep;
  const A=round2(Math.abs(x2-x1)),B=round2(Math.abs(y2-y1)),same=A===0&&B===0;
  const C=Math.round(Math.hypot(A,B)*10)/10;
  const sx=Math.sign(x2-x1),sy=Math.sign(y2-y1);
  const fspec={pts:[{x:x1,y:y1,label:'Start',...(sx>0?{lx:-5.6,ly:-0.7}:{})},{x:x2,y:y2,cls:'end',label:'End',...(sx<0?{lx:-4.6}:{}),...(sy<0?{ly:-2.6}:{})}]};
  if(!same)fspec.triangle={x1,y1,x2,y2,showA:true,showB:true,showC:false};
  const mkYd=(cur)=>Array.from({length:21},(_,k)=>`<option value="${k}"${k===cur?' selected':''}>${lineName(k)}</option>`).join('');
  const mkOff=(cur)=>Array.from({length:8},(_,i)=>`<option value="${i}"${i===cur?' selected':''}>${i===0?'On the line':i+' steps'}</option>`).join('');
  const mkDir=(k,cur)=>{const[a,b]=calcDirLabel(k);return `<option value="-1"${cur===-1?' selected':''}>${a}</option><option value="1"${cur===1?' selected':''}>${b}</option>`;};
  const mkDep=(cur)=>Array.from({length:17},(_,i)=>{const d=i-8;return `<option value="${d}"${d===cur?' selected':''}>${d===0?'On the front hash':`${steps(Math.abs(d))} ${d<0?'in front':'behind'}`}</option>`;}).join('');
  const countOpts=[4,6,8,12,16,24,32].map(c=>`<option value="${c}"${c===calc3.counts?' selected':''}>${c}</option>`).join('');
  const dirS=calc3.soff>0?`<label>${calcDirLabel(calc3.sk).join('/')} <select data-calc3="sdir">${mkDir(calc3.sk,calc3.sdir)}</select></label>`:'';
  const dirE=calc3.eoff>0?`<label>${calcDirLabel(calc3.ek).join('/')} <select data-calc3="edir">${mkDir(calc3.ek,calc3.edir)}</select></label>`:'';
  let results='';
  if(same){results='<p class="note">Pick two different dots.</p>';}
  else if(calc3.shown){
    const ss=8*calc3.counts/C;
    results=`<p><b>A</b> = ${rulerSegments(x1,x2).length>1?rulerSumLine(x1,x2):steps(A)} over. <b>B</b> = ${steps(B)} forward or back.</p>
<p><b>C</b> = √(A² + B²) = √(${fmt(A)}² + ${fmt(B)}²) = √${fmt(A*A+B*B)} = <b>${fmtC(C)} steps</b></p>
${B===0?'<p class="note">This one\'s straight side to side, so it\'s just Level 2.</p>':''}
${A===0?'<p class="note">This one\'s straight forward or back. C is just B.</p>':''}
<p><b>Gut check:</b> ${calc3.counts} counts, ${fmtC(C)} steps. ${gutSentence(C,calc3.counts)}</p>
<p><b>Step size:</b> 8 × ${calc3.counts} ÷ ${fmtC(C)} = <b>${fmtSS(ss)}</b> — ${ssLean(ss)}.</p>
${ss<4?'<p class="note">That\'s a huge step. Most drill won\'t ask for this.</p>':''}`;}
  return `<div class="custom">
<label>Start <select data-calc3="sk">${mkYd(calc3.sk)}</select></label>
<label>Offset <select data-calc3="soff">${mkOff(calc3.soff)}</select></label>${dirS}
<label>Depth <select data-calc3="sdep">${mkDep(calc3.sdep)}</select></label>
</div>
<div class="custom">
<label>End <select data-calc3="ek">${mkYd(calc3.ek)}</select></label>
<label>Offset <select data-calc3="eoff">${mkOff(calc3.eoff)}</select></label>${dirE}
<label>Depth <select data-calc3="edep">${mkDep(calc3.edep)}</select></label>
</div>
<div class="custom"><label>Counts <select data-calc3="counts">${countOpts}</select></label></div>
<figure class="fig">${fieldSVG(fspec)}</figure>
${results?`<div class="fb ok"><div class="prose">${results}</div></div>`:''}
${!calc3.shown&&!same?`<div class="btn-row"><button class="btn primary" data-act="calc3show">Show me</button></div>`:''}`;
}

async function classProgress(){if(!CLS)return;const sid=CLS.studentId;
  const u=RESULTS_URL+'?'+new URLSearchParams({action:'progress',class:CLS.classCode,student:sid});
  let d;try{const r=await fetch(u);d=await r.json();}catch(e){return;}
  if(!d||!CLS||CLS.studentId!==sid)return;
  if(!d.ok){if(d.error==='unknown_student'){classLeave();toast('Your coach removed this join. Ask for a new link.');classRender();progressRender();}return;}
  const qb={};queueLoad().forEach(r=>{if(r.studentId===sid&&r.type==='result')qb[r.level]=Math.max(qb[r.level]||0,r.score||0);});
  const best=d.best||{},att=d.attempts||{};
  new Set([...Object.keys(best),...Object.keys(S.best),...Object.keys(qb)].map(Number).filter(n=>n>0)).forEach(L=>{
    S.best[L]=Math.max(+best[L]||0,S.best[L]||0,qb[L]||0);});
  S.unlocked=calcUnlocked();save();
  CLS.attempts=CLS.attempts||{};Object.keys(att).forEach(L=>{CLS.attempts[L]=Math.max(CLS.attempts[L]||0,+att[L]||0);});
  CLS.lastSent=newer(CLS.lastSent,d.lastSent);classSave();progressRender();}

  classSyncName();
  if(view.name==='intro')render();else document.getElementById('who').textContent=S.name||'';
  c.textContent=PREVIEW?'Coach preview':!CLS?'Join a class':CLS.name?`Joined: ${CLS.name} · ${CLS.classCode}`:`Joined · ${CLS.classCode}`;
  const p=document.getElementById('clsPanel');if(!p.hidden)classPanelFill();}
function classPanelFill(){const p=document.getElementById('clsPanel');
  p.innerHTML=PREVIEW?`<p style="margin:0">Coach preview: all levels unlocked. Nothing here is recorded or sent to a class.</p>`:CLS?`<p style="margin:0">Joined ${CLS.name?`as <b>${esc(CLS.name)}</b> in `:''}<b>${esc(CLS.classCode)}</b>. <button class="linkbtn" data-act="clsleave">Not you? Leave class</button></p>`
    :`<div class="cls-form"><label for="clsClass">Class code<input id="clsClass" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="20"></label>
<label for="clsCode">Join code<input id="clsCode" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="5"></label>
<button class="btn primary" data-act="clsjoin" id="clsBtn">Join</button></div>`;}
function classPanelOpen(){const p=document.getElementById('clsPanel');p.hidden=false;classPanelFill();
  document.getElementById('clsChip').setAttribute('aria-expanded','true');const i=document.getElementById('clsClass');if(i)i.focus();}
function classPanelClose(){document.getElementById('clsPanel').hidden=true;document.getElementById('clsChip').setAttribute('aria-expanded','false');}
// Dropdown dismissal. Capture phase so it sees the target before other handlers re-render the panel or page.
document.addEventListener('click',e=>{const p=document.getElementById('clsPanel'),t=e.target;
  if(p.hidden||p.contains(t)||t.closest('[data-act="clsopen"]'))return;classPanelClose();},true);
document.addEventListener('keydown',e=>{const p=document.getElementById('clsPanel');
  if(e.key==='Escape'&&!p.hidden){classPanelClose();document.getElementById('clsChip').focus();}});
// Resolves to 'ok' | 'not_found' | 'try_later'. Unknown server errors count as try_later so a link is never thrown away.
async function classJoin(cls,code){
  const u=RESULTS_URL+'?'+new URLSearchParams({action:'join',class:cls,code});
  let d;try{const r=await fetch(u);d=await r.json();}catch(e){return 'try_later';}
  if(d&&d.ok&&d.studentId){CLS={classCode:d.classCode||cls,studentId:d.studentId,name:d.name||'',joinedAt:new Date().toISOString()};classSave();classOwn();classRender();progressRender();
    toast(CLS.name?`Joined as ${CLS.name} (${CLS.classCode})`:`Joined ${CLS.classCode}`);classProgress();return 'ok';}
  return d&&d.error==='not_found'?'not_found':'try_later';}
const MSG_NOT_FOUND="That join link didn't work. Ask your coach for a new one.";
const MSG_TRY_LATER="Couldn't reach the class right now. Your link will work later.";
async function classSubmit(){if(joining)return;const ci=document.getElementById('clsClass'),ji=document.getElementById('clsCode');if(!ci||!ji)return;
  const cls=ci.value.trim().toUpperCase(),code=ji.value.trim().toUpperCase();
  if(!cls||code.length!==5){toast('Enter your class code and your 5-character join code.');return;}
  const b=document.getElementById('clsBtn');joining=true;if(b){b.disabled=true;b.textContent='Joining…';}
  const res=await classJoin(cls,code);joining=false;
  if(res==='ok'){classPanelClose();return;}
  if(b){b.disabled=false;b.textContent='Join';}
  toast(res==='not_found'?"That code didn't work. Check it with your coach.":"Couldn't reach the class right now. Try again in a minute.");}
// ---- Practice-check results (mpr-queue-v1). Queued first so nothing is lost offline; the hub dedupes on resultId.
const QUEUE_KEY='mpr-queue-v1', QUEUE_MAX=200;
// Skill labels for missed questions, keyed by level then the question type from P1–P4. Hub keeps letters, numbers, spaces and &'()-; max 40 chars.
const SKILLS={
  1:{name:'Naming a spot',find:'Finding a spot',concept:'Field reading basics'},
  2:{countLine:'Counting steps',gut:'Step size by eye',sizeLine:'Step size',countOffset:'Counting steps off a line',sizeOffOn:'Step size off a line',
     sizeOffOff:'Step size off a line',cross50:'Crossing the 50',countsNeeded:'Counts needed',land:'Where you land',compare:'Comparing moves'},
  3:{findA:'Find A and B',findB:'Find A and B',cRange:'Pythagorean C',cClean:'Pythagorean C',cReal:'Pythagorean C',gut:'Diagonal step size by eye',
     ssClean:'Diagonal step size',ssReal:'Diagonal step size',ssFull:'Full diagonal problem',compare:'Comparing diagonal moves'},
  4:{half:'Halfway checkpoint',quarter:'Quarter checkpoint',fraction:'Finding the fraction',diag:'Diagonal checkpoint',
     depth:'Depth checkpoint',cross:'Crossing a yard line',odd:'Odd-count checkpoint',recover:'Recovering on time'}};
const PLANS={1:P1,2:P2,3:P3,4:P4,5:P5,6:P6};
function skillLabel(n,i){const t=PLANS[n]&&PLANS[n][i];return ((SKILLS[n]&&SKILLS[n][t])||`Level ${n}`).replace(/[^A-Za-z0-9 &'()-]/g,'').slice(0,40);}
function queueLoad(){try{const q=JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]');return Array.isArray(q)?q:[];}catch(e){return [];}}
function queueStore(q){try{localStorage.setItem(QUEUE_KEY,JSON.stringify(q.slice(-QUEUE_MAX)));}catch(e){}}
function queuePending(){return CLS?queueLoad().some(r=>r.studentId===CLS.studentId):false;}
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'r-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);
function queueResult({level,score,total,passed,missed}){if(!CLS||PREVIEW)return;
  CLS.attempts=CLS.attempts||{};const attempt=CLS.attempts[level]=(CLS.attempts[level]||0)+1;classSave();
  const q=queueLoad();q.push({type:'result',resultId:uuid(),lesson:LESSON_ID,classCode:CLS.classCode,studentId:CLS.studentId,level,score,total,passed,
    attempt,missed,field:S.hash==='hs'?'hs':'college',clientTime:new Date().toISOString(),appVersion:APP_VERSION});
  queueStore(q);flushQueue();}
let flushing=false;
async function flushQueue(){if(flushing||PREVIEW)return;flushing=true;let removed=false;
  try{for(;;){const item=queueLoad()[0];if(!item)break;let d;
    try{const r=await fetch(RESULTS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(item)});d=await r.json();}
    catch(e){break;} // offline or unreadable reply: keep it for next time
    if(!d||(!d.ok&&d.retry))break;
    // ok (incl. duplicate), or a rejection that will never succeed: drop it
    queueStore(queueLoad().filter(r=>r.resultId!==item.resultId));
    if(d.ok&&CLS&&CLS.studentId===item.studentId){CLS.lastSent=newer(CLS.lastSent,new Date().toISOString());classSave();}
    if(!d.ok&&d.error==='unknown_student'&&CLS&&CLS.studentId===item.studentId){removed=true;classLeave();}}}
  finally{flushing=false;}
  if(removed){toast('Your coach removed this join. Ask for a new link.');classRender();progressRender();return;}
  if(view.name==='results')render();
  await classProgress();}
addEventListener('online',flushQueue);
async function classBoot(){classLoad();classRender();let u;try{u=new URL(location.href);}catch(e){return;}
  const cls=(u.searchParams.get('class')||'').trim().toUpperCase(),code=(u.searchParams.get('code')||'').trim().toUpperCase();
  if(!cls||!code)return;
  const strip=()=>{u.searchParams.delete('class');u.searchParams.delete('code');history.replaceState(null,'',u.pathname+u.search+u.hash);};
  const res=await classJoin(cls,code);
  if(res==='ok')strip();
  else if(res==='not_found')toast(MSG_NOT_FOUND);
  else toast(MSG_TRY_LATER);}

const COACH_WORD='EUROPE2015'; // ?coach=<this> unlocks all levels for this page load only
function coachUnlock(){let u;try{u=new URL(location.href);}catch(e){return;}
  if(!u.searchParams.has('coach'))return;
  const ok=u.searchParams.get('coach')===COACH_WORD;
  if(!ok)return;
  COACH=true;document.getElementById('coachNote').hidden=false;
  u.searchParams.delete('coach');history.replaceState(null,'',u.pathname+u.search+u.hash);}
// Coach preview link (#coachclass=CODE&coachkey=KEY): checked with the hub; the hash stays so a reload stays in preview.
// A student join on this device is ignored for this page load only (mpr-class-v1 is left alone).
async function coachPreview(){const h=new URLSearchParams(location.hash.slice(1));
  const cls=(h.get('coachclass')||'').trim().toUpperCase(),key=(h.get('coachkey')||'').trim();
  if(!cls||!key)return false;
  classRender();
  let d;try{const r=await fetch(RESULTS_URL+'?'+new URLSearchParams({action:'coachcheck',class:cls,key}),{referrerPolicy:'no-referrer'});d=await r.json();}catch(e){d=null;}
  if(d&&d.ok){PREVIEW=COACH=true;CLS=null;quiz=null;Object.assign(S,{best:{},unlocked:1,name:''});
    const n=document.getElementById('coachNote');n.firstElementChild.textContent='Coach preview: all levels unlocked. Nothing here is recorded.';n.hidden=false;
    classPanelClose();classRender();progressRender();return true;}
  if(d&&d.error==='not_found'){toast("That coach link isn't valid anymore.");history.replaceState(null,'',location.pathname+location.search);}
  else toast("Couldn't check the coach link. Reload to try again.");
  return false;}
load();classLoad();classOwn();classSyncName();coachUnlock();render();
coachPreview().then(on=>{if(!on){classBoot();flushQueue();}});
window.__CB={GEN,S,posDesc,cbPos};
</script>
